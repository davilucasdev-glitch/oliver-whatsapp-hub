# Oliver WhatsApp Hub — sobe tudo com:  docker compose up -d --build
# Antes: copie .env.example para .env e preencha.
name: oliver-hub

services:
  postgres:
    image: postgres:16-alpine # já inclui a extensão pg_trgm (contrib)
    restart: unless-stopped
    environment:
      POSTGRES_USER: oliver
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?defina POSTGRES_PASSWORD no .env}
      POSTGRES_DB: oliver_hub
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U oliver -d oliver_hub"]
      interval: 5s
      timeout: 5s
      retries: 20

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes", "--maxmemory-policy", "noeviction"]
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  # Aplica as migrations versionadas e encerra.
  migrate:
    build: { context: ., dockerfile: apps/api/Dockerfile }
    env_file: .env
    command: ["node", "/app/node_modules/prisma/build/index.js", "migrate", "deploy"]
    depends_on:
      postgres: { condition: service_healthy }
    restart: "no"

  api:
    build: { context: ., dockerfile: apps/api/Dockerfile }
    restart: unless-stopped
    env_file: .env
    environment:
      QUEUE_DRIVER: bullmq
    # só neste servidor: de fora, tudo passa pelo HTTPS (caddy)
    ports:
      - "127.0.0.1:3001:3001"
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
      migrate: { condition: service_completed_successfully }

  worker:
    build: { context: ., dockerfile: apps/api/Dockerfile }
    restart: unless-stopped
    env_file: .env
    environment:
      QUEUE_DRIVER: bullmq
    command: ["node", "dist/src/worker.js"]
    healthcheck:
      disable: true
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
      migrate: { condition: service_completed_successfully }

  # Painel. Repassa /api/* para o serviço "api" pela rede interna.
  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        API_INTERNAL_URL: http://api:3001
    restart: unless-stopped
    ports:
      - "127.0.0.1:3000:3000"
    depends_on:
      api: { condition: service_healthy }

  # HTTPS (opcional): docker compose --profile https up -d --build
  # Com ele, painel e webhook ficam em https://DOMAIN (PUBLIC_BASE_URL e PANEL_URL = https://DOMAIN, COOKIE_SECURE=true).
  caddy:
    image: caddy:2.10-alpine
    profiles: ["https"]
    restart: unless-stopped
    environment:
      DOMAIN: ${DOMAIN:-}
      ACME_EMAIL: ${ACME_EMAIL:-}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddydata:/data
      - caddyconfig:/config
    depends_on:
      api: { condition: service_healthy }
      web: { condition: service_healthy }

  # Cópia do banco todo dia (e a cada subida), guardada 14 dias em ./backups (fora do Docker).
  # Restaurar: deploy/restaurar-backup.sh backups/oliver-hub-AAAA-MM-DD_HHMM.sql.gz
  backup:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      PGPASSWORD: ${POSTGRES_PASSWORD:?defina POSTGRES_PASSWORD no .env}
      BACKUP_DAYS: ${BACKUP_DAYS:-14}
    volumes:
      - ./backups:/backups
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        while true; do
          f=/backups/oliver-hub-$$(date +%Y-%m-%d_%H%M).sql.gz
          if pg_dump -h postgres -U oliver -d oliver_hub --no-owner | gzip > "$$f.tmp"; then mv "$$f.tmp" "$$f"; echo "backup ok: $$f"; else rm -f "$$f.tmp"; echo "BACKUP FALHOU"; fi
          find /backups -name 'oliver-hub-*.sql.gz' -mtime +$$BACKUP_DAYS -delete
          sleep 86400
        done
    depends_on:
      postgres: { condition: service_healthy }

volumes:
  pgdata:
  redisdata:
  caddydata:
  caddyconfig:
